# 项目相关配置
ruoyi:
  # 名称
  name: 管理系统
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${RUOYI_PROFILE:/opt/chaye/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: ${LOG_LEVEL_COM_RUOYI:info}
    org.springframework: ${LOG_LEVEL_SPRING:warn}

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:false}
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: ${REDIS_DATABASE:0}
    # 密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  # 生产必须通过环境变量注入高强度随机值；缺失时拒绝启动，禁止使用若依示例密钥。
  secret: ${TOKEN_SECRET}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: ${SWAGGER_ENABLED:false}
  # 请求前缀
  pathMapping: ${SWAGGER_PATH_MAPPING:/dev-api}

# 跨域白名单。H5 正式站同源走 /api；后台域名只开放这里明确列出的来源。
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://chaye.okam.top,https://chayeht.okam.top}

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,chaye.okam.top,chayeht.okam.top,ruoyi.vip,www.ruoyi.vip

# 商城测试版开关。生产环境保持 false；测试服务器通过环境变量显式开启。
mall:
  # 运行环境必须显式声明。默认 production，避免误开测试能力。
  environment: ${MALL_ENVIRONMENT:production}
  test-mode: ${MALL_TEST_MODE:false}
  sms:
    # 仅供 local/dev/test 隔离验收的随机动态验证码通道；生产默认关闭。
    test-enabled: ${MALL_TEST_SMS_ENABLED:false}
    fixed-test-code: ${MALL_TEST_SMS_FIXED_CODE:}
  test-payment:
    # 非生产仅当 enabled=true 且 environment 为 local/dev/development/test/testing 时可用。
    enabled: ${MALL_TEST_PAYMENT_ENABLED:false}
    # 上线前全账号模拟支付：必须同时开启 enabled，只作用于已登录商城客户。
    # 现有及未来注册账号均适用，不开启短信测试或绕过登录；正式营业前关闭。
    all-customers-enabled: ${MALL_TEST_PAYMENT_ALL_CUSTOMERS_ENABLED:false}
    # 全账号模式关闭时，保留服务器白名单方式；所有开关默认关闭。
    production-whitelist-enabled: ${MALL_TEST_PAYMENT_PRODUCTION_WHITELIST_ENABLED:false}
    allowed-phones: ${MALL_TEST_PAYMENT_ALLOWED_PHONES:}
    # 白名单模式下支持尚未绑定手机号的真实微信账号。
    allowed-customer-ids: ${MALL_TEST_PAYMENT_ALLOWED_CUSTOMER_IDS:}
  wechat:
    code-env-version: ${MALL_WECHAT_CODE_ENV_VERSION:trial}
    app-id: ${MALL_WECHAT_APP_ID:}
    app-secret: ${MALL_WECHAT_APP_SECRET:}

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
